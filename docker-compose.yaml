services:
  database:
    image: postgres:14
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    ports:
      - '${MINIO_PORT}:9000'
      - '${MINIO_CONSOLE_PORT}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD}; do
        echo 'Ожидание запуска MinIO...';
        sleep 2;
      done;

      mc mb --ignore-existing myminio/${STORAGE_BUCKET_NAME};

      mc ilm rm --all --force myminio/${STORAGE_BUCKET_NAME};

      mc ilm rule add --expire-days 1 --prefix 'temp/' myminio/${STORAGE_BUCKET_NAME};

      echo 'Настройка MinIO завершена успешно!';
      exit 0;
      "

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-local
    privileged: true
    user: root
    ports:
      - '8080:8080'
      - '50000:50000' 
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
